<style>
:root{
  --kl:#e74c3c;--melaka:#3498db;--penang:#9b59b6;--sin:#27ae60;
  --bg:#f5f6fa;--card:#fff;--txt:#2c3e50;--sub:#7f8c8d;--line:#e8e8e8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"WenQuanYi Micro Hei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;padding-bottom:90px}
header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:24px 16px 20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header h1{font-size:20px;font-weight:700;margin-bottom:4px}
header .sub{font-size:13px;opacity:.85}
.sync-bar{position:sticky;top:0;z-index:99;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.sync-status{flex:1;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.sync-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;flex-shrink:0}
.sync-status .dot.ok{background:#27ae60;box-shadow:0 0 6px rgba(39,174,96,.5)}
.sync-status .dot.err{background:#e74c3c;box-shadow:0 0 6px rgba(231,76,60,.5)}
.sync-status .dot.saving{background:#f39c12;box-shadow:0 0 6px rgba(243,156,18,.5);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;position:sticky;top:41px;z-index:98;background:#fff;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;cursor:pointer}
.tab.active{color:#667eea;border-bottom-color:#667eea}
.tab-content{display:none;padding:12px}
.tab-content.active{display:block}

/* 行程卡片 */
.day{margin-bottom:18px}
.day-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px 14px;border-radius:12px;color:#fff;font-weight:700;font-size:15px}
.day-1 .day-head{background:linear-gradient(135deg,#ff7675,#d63031)}
.day-2 .day-head{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.day-3 .day-head{background:linear-gradient(135deg,#a29bfe,#6c5ce7)}
.day-4 .day-head{background:linear-gradient(135deg,#55efc4,#00b894)}

.card.kl{border-left-color:var(--kl)}
.card.melaka{border-left-color:var(--melaka)}
.card.penang{border-left-color:var(--penang)}
.card.sin{border-left-color:var(--sin)}
.card .time{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:2px}
.card .place{font-size:15px;font-weight:700;margin-bottom:4px}
.card .desc{font-size:13px;color:#555;margin-bottom:6px}
.card .tag{display:inline-block;background:#f0f0f0;border-radius:6px;padding:2px 8px;font-size:11px;color:#666;margin-right:4px;margin-top:4px}
.card .nav-btn{display:inline-block;background:#eaf2ff;color:#2980b9;font-size:11px;padding:4px 10px;border-radius:6px;margin-top:6px;font-weight:600;text-decoration:none}

/* 地图 */
#map{width:100%;height:300px;border-radius:12px;overflow:hidden;margin-bottom:10px}
.poi-list{margin-top:10px}

.poi a{color:#2980b9;font-size:12px;font-weight:600;text-decoration:none}

/* 攻略 */
.tip{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.tip b{color:#e74c3c}

.editor-wrap.active{display:flex}
.editor-panel{background:#fff;width:100%;max-width:680px;max-height:85vh;border-radius:20px 20px 0 0;padding:20px;display:flex;flex-direction:column;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

textarea{width:100%;flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;font-family:ui-monospace,Monaco,Consolas,monospace;resize:none;line-height:1.5}
.editor-actions{display:flex;gap:8px;margin-top:12px}

.fab:active{transform:scale(.92)}

footer{text-align:center;font-size:11px;color:#aaa;padding:16px}
</style>
</head>

// ====== 工具函数 ======
function setStatus(text, type){
  const st = document.getElementById('syncStatus');
  const dot = '<span class="dot '+(type||'')+'"></span>';
  st.innerHTML = dot + text;
}
function showToast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;transition:opacity .3s';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2000);
}

// ====== 数据加载 ======
async function loadData(){
  // 1. 先读本地缓存（秒开）
  try{
    const cached = localStorage.getItem(STORAGE_KEY);
    if(cached){ currentData = JSON.parse(cached); return; }
  }catch(e){}

  // 2. 读 GitHub 上的文件
  try{
    const res = await fetch(API_URL, {headers:{Authorization:`token ${TOKEN}`}});
    if(res.ok){
      const data = await res.json();
      currentData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
      return;
    }
  }catch(e){/* fall through to default */}
  
  // 3. 用默认数据
  currentData = JSON.parse(JSON.stringify(DEFAULT_DATA));
}

// ====== 保存（自动 + 手动） ======
async function saveData(silent){
  if(saveInProgress) return;
  saveInProgress = true;
  
  if(!silent) setStatus('保存中...', 'saving');
  
  const json = JSON.stringify(currentData);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  
  try{
    // 先获取当前文件的 sha
    let sha = null;
    try{
      const res = await fetch(API_URL, {headers:{Authorization:`token ${TOKEN}`}});
      if(res.ok){ sha = (await res.json()).sha; }
    }catch(e){}
    
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers:{
        'Authorization':`token ${TOKEN}`,
        'Content-Type':'application/json',
        'Accept':'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        message: 'Update itinerary via web (auto-save)',
        content: b64,
        sha: sha // null = 新建文件
      })
    });
    
    if(res.ok){
      // 更新本地缓存
      localStorage.setItem(STORAGE_KEY, json);
      if(!silent){
        setStatus('✅ 已保存并发布 · 其他人刷新即看到', 'ok');
        showToast('✅ 保存成功！其他人刷新页面即可看到更新');
      }
    }else{
      const err = await res.json().catch(()=>({}));
      throw new Error(err.message || ('HTTP '+res.status));
    }
  }catch(e){
    if(!silent){
      setStatus('❌ 保存失败：'+e.message, 'err');
      showToast('❌ 保存失败：'+e.message);
    }
  }finally{
    saveInProgress = false;
    if(!silent){
      setTimeout(()=>{ setStatus('✅ 已同步 · 自动保存已开启', 'ok'); }, 3000);
    }
  }
}

// ====== 渲染 ======
function render(){
  let html = '';
  currentData.days.forEach(d=>{
    html += '<div class="day day-'+d.id+'"><div class="day-head">'+d.title+'</div>';
    d.items.forEach((it)=>{
      html += '<div class="card '+it.tags[0]+'">'+
        '<div class="time">🕐 '+it.time+'</div>'+
        '<div class="place">📍 '+it.place+'</div>'+
        '<div class="desc">'+it.desc+'</div>'+
        (it.mapQuery?'<a class="nav-btn" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.mapQuery)+'" target="_blank">📍 导航</a>':'')+
        '</div>';
    });
    html += '</div>';
  });
  document.getElementById('itinerary-container').innerHTML = html;

  let th = '';
  currentData.tips.forEach(t=>{ th += '<div class="tip"><b>'+t.b+'</b><br>'+t.t+'</div>'; });
  document.getElementById('tips-container').innerHTML = th;

  let ph = '';
  currentData.days.forEach(d=>{
    d.items.forEach(it=>{
      if(it.mapQuery){
        ph += '<div class="poi"><span>📍 '+it.place+'</span><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.mapQuery)+'" target="_blank">导航 →</a></div>';
      }
    });
  });
  document.getElementById('poi-list').innerHTML = ph;
  document.getElementById('shareUrl').textContent = location.href;
}

  event.target.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='map') initMap();
}

  try{
    const newData = JSON.parse(document.getElementById('editArea').value);
    currentData = newData;
    await saveData(false); // 非静默 = 显示状态 + Toast
    render();
    closeEditor();
  }catch(e){
    setStatus('❌ JSON格式错误', 'err');
    showToast('❌ JSON格式错误：'+e.message);
  }
}

// ====== 启动 ======
(async function init(){
  setStatus('加载中...', '');
  await loadData();
  render();
  // 显示已同步状态
  const d = new Date();
  setStatus('✅ 已同步 · 自动保存已开启', 'ok');
})();
</script>
</body>
